name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect...
        2. Select...
        3. Press...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version or commit
  - type: input
    id: windows
    attributes:
      label: Windows version
  - type: input
    id: ports
    attributes:
      label: Launchpad model and MIDI port names
  - type: textarea
    id: errors
    attributes:
      label: Error messages or additional context

